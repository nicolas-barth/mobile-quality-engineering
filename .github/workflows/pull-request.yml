name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        default: smoke
        options:
          - smoke
          - critical
          - functional
          - device
          - regression
      android_api:
        description: Android emulator API level
        type: string
        default: '33'
      device_profile:
        description: Android emulator device profile
        type: string
        default: pixel_6
      headless:
        description: Run the emulator without a visible window
        type: boolean
        default: true

concurrency:
  group: pull-request-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Prepare Android application for static package checks
        run: bash scripts/prepare-android-app.sh

      - name: APK metadata and manifest static security scan
        run: npm run security:scan
        env:
          ANDROID_HOME: /opt/android-sdk-placeholder
          JAVA_HOME: /opt/java-placeholder
          ANDROID_DEVICE_NAME: Android Emulator
          ANDROID_PLATFORM_VERSION: '33'
          ANDROID_APP_PATH: ./app/android/mda-2.2.0-25.apk
          ANDROID_APP_PACKAGE: com.saucelabs.mydemoapp.android
          ANDROID_APP_ACTIVITY: com.saucelabs.mydemoapp.android.view.activities.SplashActivity

      - name: Upload security scan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-summary
          path: reports/security/
          if-no-files-found: ignore
          retention-days: 14

  android-tests:
    name: Android tests
    needs: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install UiAutomator2 driver
        run: npm run appium:install-driver

      - name: Prepare Android application
        run: bash scripts/prepare-android-app.sh

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Determine suites and emulator profile
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "suites=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
            echo "api_level=${{ inputs.android_api }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.device_profile }}" >> "$GITHUB_OUTPUT"
            echo "headless=${{ inputs.headless }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "suites=smoke critical" >> "$GITHUB_OUTPUT"
            echo "api_level=33" >> "$GITHUB_OUTPUT"
            echo "profile=pixel_6" >> "$GITHUB_OUTPUT"
            echo "headless=true" >> "$GITHUB_OUTPUT"
          else
            echo "suites=functional device-lifecycle" >> "$GITHUB_OUTPUT"
            echo "api_level=33" >> "$GITHUB_OUTPUT"
            echo "profile=pixel_6" >> "$GITHUB_OUTPUT"
            echo "headless=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run suites on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.plan.outputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ steps.plan.outputs.profile }}
          force-avd-creation: false
          emulator-options: >-
            ${{ steps.plan.outputs.headless == 'true' && '-no-window' || '' }}
            -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            npm run appium:start > appium.log 2>&1 &
            sleep 10
            for suite in ${{ steps.plan.outputs.suites }}; do
              npx wdio run wdio.conf.ts --suite "$suite"
            done
        env:
          NODE_ENV: ci
          ANDROID_DEVICE_NAME: Android Emulator
          ANDROID_PLATFORM_VERSION: ${{ steps.plan.outputs.api_level }}
          ANDROID_APP_PATH: ./app/android/mda-2.2.0-25.apk
          ANDROID_APP_PACKAGE: com.saucelabs.mydemoapp.android
          ANDROID_APP_ACTIVITY: com.saucelabs.mydemoapp.android.view.activities.SplashActivity
          APPIUM_HOST: 127.0.0.1
          APPIUM_PORT: '4723'
          WDIO_LOG_LEVEL: info
          NO_RESET: 'false'
          FULL_RESET: 'false'
          HEADLESS: ${{ steps.plan.outputs.headless }}

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report/
          if-no-files-found: ignore

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
          if-no-files-found: ignore

      - name: Upload Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore
